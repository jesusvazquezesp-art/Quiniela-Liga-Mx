body{

.contenedor{

.volver{

.titulo{

    background:#111d31;

    text-align:center;

.titulo h1{

.titulo p{

.estado{

.presentacion{

    /* =====================================================
   MENÚ DE PRESENTACIONES
===================================================== */

.grupo-presentaciones{
    margin-bottom:25px;
}

.grupo-presentaciones h2{
    margin:0 0 12px 0;
    padding:12px 14px;
    background:#18263c;
    border-radius:12px;
    font-size:18px;
    text-align:center;
}


.grid-presentaciones{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
}


.boton-presentacion{
    width:100%;
    min-height:82px;
    padding:14px 10px;

    border:1px solid #29364a;
    border-radius:14px;

    background:#111d31;
    color:white;

    cursor:pointer;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    gap:7px;

    transition:
        transform .15s ease,
        background .15s ease,
        border-color .15s ease;
}


.boton-presentacion:hover{
    background:#18263c;
    border-color:#2f8cff;
}


.boton-presentacion:active{
    transform:scale(.97);
}


.boton-evento{
    font-size:17px;
    font-weight:bold;
}


.boton-fecha{
    font-size:11px;
    opacity:.65;
}


/* =====================================================
   DETALLE DE PRESENTACIÓN
===================================================== */

#detallePresentacion{
    margin-top:20px;
}


.detalle-presentacion{
    background:#111d31;
    border-radius:16px;
    padding:18px;

    box-shadow:
        0 4px 15px rgba(0,0,0,.25);
}


.detalle-cabecera{
    display:flex;
    justify-content:space-between;
    align-items:center;

    gap:12px;

    margin-bottom:18px;
}


.detalle-cabecera h2{
    margin:4px 0 0 0;
    font-size:22px;
}


.btn-cerrar-detalle{
    width:42px;
    height:42px;

    border:none;
    border-radius:10px;

    background:#555;
    color:white;

    font-size:18px;
    font-weight:bold;

    cursor:pointer;
}


.btn-cerrar-detalle:hover{
    background:#777;
}


/* =====================================================
   ESCRITORIO
===================================================== */

@media(min-width:700px){

    .grid-presentaciones{
        grid-template-columns:
            repeat(4,1fr);
    }

}

.presentacion-titulo{

    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:10px;

    margin-bottom:16px;

}

.presentacion-titulo h2{

    margin:0;

.dato{

.dato:last-child{

.etiqueta{

.valor{

}

.estado-animacion{

}

.sin-datos{

.btn-editar{

    margin-top:10px;

    padding:12px;

.editor-fechas{

function mostrarFecha(fecha){

    if(!fecha){

        return "Sin fecha";

    }

    const f = new Date(fecha);

    return f.toLocaleString("es-MX",{

        day:"2-digit",
        month:"2-digit",
        year:"numeric",
        hour:"2-digit",
        minute:"2-digit"

    });

}

function convertirParaInput(fecha){

    if(!fecha){

        return "";

    }

    return new Intl.DateTimeFormat("sv-SE", {

        timeZone:"America/Mexico_City",

        year:"numeric",
        month:"2-digit",
        day:"2-digit",
        hour:"2-digit",
        minute:"2-digit",

        hourCycle:"h23"

    })
    .format(new Date(fecha))
    .replace(" ","T");

}

async function obtenerFondos(){

    const url =
        "https://api.github.com/repos/jesusvazquezesp-art/Quiniela-Liga-Mx/contents/presentaciones/fondos";

    try{

        const respuesta = await fetch(url);

        if(!respuesta.ok){

            throw new Error(
                `GitHub respondió ${respuesta.status}`
            );

        }

        const archivos = await respuesta.json();

        return archivos

            .filter(archivo =>
                archivo.type === "file" &&
                archivo.name.toLowerCase().endsWith(".webp")
            )

            .map(archivo =>
                archivo.name.replace(/\.webp$/i, "")
            );

    }catch(error){

        console.error(
            "❌ Error leyendo fondos del repositorio"
        );

        console.error(error);

        return [];

    }

}

                    : presentacion.evento === "FINAL"
                        ? "Final"
                        : `Jornada ${presentacion.contenido}`}
        </span>

        <span class="boton-fecha">
            ${mostrarFecha(presentacion.inicio)}
        </span>

    `;


    tarjeta.addEventListener(
        "click",
        () => {

            mostrarDetallePresentacion(
                presentacion,
                fondos
            );

        }
    );


    if(
        presentacion.evento === "4TOS" ||
        presentacion.evento === "SEMIS" ||
        presentacion.evento === "FINAL"
    ){

        liguilla.appendChild(tarjeta);

    }else{

        faseRegular.appendChild(tarjeta);

    }

});
}


cargarPresentaciones();

</script>


</body>

</html>
