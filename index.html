<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Quiniela MX</title>

<style>

body{

    margin:0;
    font-family:Arial,sans-serif;
    color:white;
    background:#111827;

    display:flex;
    justify-content:center;
    align-items:center;

    min-height:100vh;

    overflow:hidden;

}

/*==========================
  SKIN PATRIO
==========================*/

body.skin-independencia::before{

    content:"";

    position:fixed;

    inset:0;

    background:url("img/bandera-patria.webp") center center/cover no-repeat;

    opacity:.50;

    pointer-events:none;

    z-index:-1;

}

/*==========================
  CONTENEDOR
==========================*/

.contenedor{

    text-align:center;

    max-width:500px;

}

.contenedor h2{

    margin:0;

    font-size:42px;

}

.contenedor h3{

    margin:18px 0;

    font-size:30px;

}

.contenedor p{

    color:#d1d5db;

    font-size:18px;

    line-height:1.5;

}

.jornada{

    margin-top:18px;

    font-weight:bold;

    color:#ffd54f;

}

    #estado{

    margin-top:35px;

    text-align:left;

    width:max-content;

    margin-left:auto;

    margin-right:auto;

    font-size:26px;

    line-height:44px;

}
    
/*==========================
  ESTADO
==========================*/

#estado{

    margin:35px auto 0;

    display:inline-block;

    text-align:left;

    font-size:22px;

    line-height:38px;

}

</style>

</head>

<body>

<div class="contenedor">

    <h2>⚽ Quiniela MX</h2>

    <h3>👋 ¡Bienvenido!</h3>

    <p>
        Todo está listo para vivir la emoción de la Liga MX.
    </p>

    <p class="jornada">
        🏆 Jornada 4 lista
    </p>

    <div id="estado">

        <div id="s1">⚪ 🌐 Conexión</div>
        <div id="s2">⚪ 📱 Funciones</div>
        <div id="s3">⚪ 🔔 Alertas</div>
        <div id="s4">⚪ ☁️ Servidor</div>
        <div id="s5">⚪ 👤 Cuenta</div>
        <div id="s6">⚪ 💬 Comunidad</div>

    </div>

</div>

<script>

if(!navigator.onLine){

    document.getElementById("estado").innerHTML=
        "🔴 Sin conexión a Internet.<br><br>Activa tus datos móviles o WiFi.";

}else{

    const s1=document.getElementById("s1");
    const s2=document.getElementById("s2");
    const s3=document.getElementById("s3");
    const s4=document.getElementById("s4");
    const s5=document.getElementById("s5");
    const s6=document.getElementById("s6");

    s1.innerHTML="🟢 🌐 Conexión";

    setTimeout(()=>{

        s2.innerHTML="🟢 📱 Funciones";

    },1000);

    setTimeout(()=>{

        s3.innerHTML="🟢 🔔 Alertas";

    },2000);

    setTimeout(()=>{

        s4.innerHTML="🟢 ☁️ Servidor";

    },3000);

    setTimeout(()=>{

        s5.innerHTML="🟢 👤 Cuenta";

    },4000);

    setTimeout(()=>{

        s6.innerHTML="🟢 💬 Comunidad";

    },5000);

    setTimeout(()=>{

        location.replace("quiniela.html");

    },6000);

}

/*==========================
  ACTIVAR SKIN EN SEPTIEMBRE
==========================*/

const hoy=new Date();

if(hoy.getMonth()===8){

    document.body.classList.add("skin-independencia");

}

// Para pruebas:
// document.body.classList.add("skin-independencia");

</script>

</body>

</html>
