<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Quiniela Liga MX</title>

<style>

body{
    margin:0;
    background:#111827;
    color:white;
    font-family:Arial,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.contenedor{
    text-align:center;
}

h1{
    margin:0;
    font-size:32px;
}

p{
    margin-top:20px;
    color:#d1d5db;
}
.bienvenida{
    text-align: center;
    margin: 30px 0;
}

.bienvenida h2{
    margin: 0;
    font-size: 30px;
}

.bienvenida h3{
    margin: 18px 0 10px;
    font-size: 24px;
}

.bienvenida p{
    margin: 8px 0;
    font-size: 17px;
    line-height: 1.5;
}

.jornada{
    margin-top: 18px;
    font-weight: bold;
}
    

</style>

</head>

<body>

<div class="contenedor">

<div class="bienvenida">
    <h2>⚽ Quiniela Liga MX</h2>

    <h3>👋 ¡Bienvenido!</h3>

    <p>Todo está listo para vivir la emoción de la Liga MX.</p>

    <p class="jornada">🏆 Jornada 4 lista</p>
</div>

<div id="estado" style="margin-top:20px;text-align:left;line-height:28px;">

<div id="s1">🟡 🌐 Conexión</div>
<div id="s2">⚪ 📱 Funciones</div>
<div id="s3">⚪ 🔔 Alertas</div>
<div id="s4">⚪ ☁️ Servidor</div>
<div id="s5">⚪ 👤 Cuenta</div>
<div id="s6">⚪ 💬 Comunidad</div>

</div>

</div>

<script>

if(!navigator.onLine){

   document.getElementById("estado").innerHTML =
"🔴 Sin conexión a Internet.<br><br>Activa tus datos móviles o WiFi.";

}else{

    console.log("✅ Internet OK");
    
    const s1=document.getElementById("s1");
const s2=document.getElementById("s2");
const s3=document.getElementById("s3");
const s4=document.getElementById("s4");
const s5=document.getElementById("s5");
const s6=document.getElementById("s6");

s1.innerHTML="🟢  🌐 Conexión";
        
   setTimeout(()=>{

    s2.innerHTML="🟢 📱 Funciones";

},1000);

    
    setTimeout(()=>{

    s3.innerHTML="🟢 🔔 Alertas";

},2000);
    
    
    setTimeout(()=>{

    s4.innerHTML="🟢 ☁️ Servidor";

},3000);
    
    setTimeout(()=>{

    s5.innerHTML="🟢 👤 Cuenta";

},4000);

setTimeout(()=>{

    s6.innerHTML="🟢 💬 Comunidad";

},5000);
    
    
    
    // Aquí irán las siguientes verificaciones

    setTimeout(()=>{

        location.replace("quiniela.html");

    },6000);

}

</script>

</body>
</html>
