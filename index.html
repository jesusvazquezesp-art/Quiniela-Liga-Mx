<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Quiniela Liga MX</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        html,
        body {

            width: 100%;
            height: 100%;

        }


        body {

            overflow: hidden;

            font-family: Arial, sans-serif;

            background: #111827;

            color: #ffffff;

        }


        /* =====================================================
           FONDO
        ===================================================== */

        #fondo {

            position: fixed;

            inset: 0;

            z-index: 1;

            background-color: #111827;

            background-position: center;

            background-size: cover;

            background-repeat: no-repeat;

        }


        /* =====================================================
           VELO
        ===================================================== */

        #velo {

            position: fixed;

            inset: 0;

            z-index: 2;

            background: rgba(0, 0, 0, .42);

            pointer-events: none;

        }


        /* =====================================================
           APLICACIÓN
        ===================================================== */

        #app {

            position: fixed;

            inset: 0;

            z-index: 3;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            text-align: center;

            padding: 20px;

        }


        .contenedor {

            width: 100%;

            max-width: 520px;

        }


        #app h2 {

            font-size: 42px;

            margin-bottom: 25px;

            text-shadow:
                0 3px 8px rgba(0, 0, 0, .95);

        }


        #estado {

            margin-top: 10px;

            display: inline-block;

            text-align: left;

            font-size: 22px;

            line-height: 42px;

            text-shadow:
                0 3px 8px rgba(0, 0, 0, .95);

        }


        /* =====================================================
           CONTENEDOR DE PRESENTACIÓN
        ===================================================== */

        #presentacion {

            position: fixed;

            inset: 0;

            z-index: 10;

            display: none;

            pointer-events: none;

        }


        /* =====================================================
           BOTÓN REINTENTAR
        ===================================================== */

        #boton-reintentar {

            margin-top: 20px;

            padding: 12px 22px;

            font-size: 18px;

            border: 0;

            border-radius: 10px;

            cursor: pointer;

        }

    </style>
    
    <script src="presentaciones/motor.js"></script>

</head>


<body>


    <!-- =====================================================
         FONDO
    ===================================================== -->

    <div id="fondo"></div>


    <!-- =====================================================
         VELO
    ===================================================== -->

    <div id="velo"></div>


    <!-- =====================================================
         APLICACIÓN
    ===================================================== -->

    <div id="app">

        <div class="contenedor">

            <h2>
                ⚽ Quiniela Liga MX
            </h2>
             <h2>
                
            </h2>
             <h2>
                ¡¡Bienvenido!!
            </h2>


            <div id="estado">

                <div id="s1">
                    ⚪ 🌐 Conexión
                </div>

                <div id="s2">
                    ⚪ 📱 Funciones
                </div>

                <div id="s3">
                    ⚪ 🔔 Alertas
                </div>

                <div id="s4">
                    ⚪ ☁️ Servidor
                </div>

                <div id="s5">
                    ⚪ 👤 Cuenta
                </div>

                <div id="s6">
                    ⚪ 💬 Comunidad
                </div>

            </div>

        </div>

    </div>


    <!-- =====================================================
         CONTENEDOR DE A001
    ===================================================== -->

    <div id="presentacion"></div>


    <!-- =====================================================
         SUPABASE
    ===================================================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <script>


        /* =====================================================
           SUPABASE
        ===================================================== */

        const SUPABASE_URL =
            "https://ytedqizoetrafbgufslp.supabase.co";


        const SUPABASE_KEY =
            "sb_publishable_zbOWRVkCHQ4ezSa7yDEdHw_734fnkxH";


        const db =
            supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        /* =====================================================
           INDICADORES
        ===================================================== */

        const s1 =
            document.getElementById("s1");

        const s2 =
            document.getElementById("s2");

        const s3 =
            document.getElementById("s3");

        const s4 =
            document.getElementById("s4");

        const s5 =
            document.getElementById("s5");

        const s6 =
            document.getElementById("s6");


        /* =====================================================
           ESTADOS
        ===================================================== */

        function estadoOK(elemento, texto) {

            elemento.textContent =
                "🟢 " + texto;

        }


        function estadoERROR(elemento, texto) {

            elemento.textContent =
                "🔴 " + texto;

        }


        function estadoCARGANDO(elemento, texto) {

            elemento.textContent =
                "⚪ " + texto;

        }


        /* =====================================================
           INTERNET
        ===================================================== */

        async function comprobarInternet() {

            if (!navigator.onLine) {

                return false;

            }


            try {

                await fetch(
                    "https://www.gstatic.com/generate_204",
                    {
                        method: "GET",
                        mode: "no-cors",
                        cache: "no-store"
                    }
                );


                return true;

            } catch (error) {

                return false;

            }

        }


        /* =====================================================
           CONFIGURACIÓN ACTUAL
        ===================================================== */

        async function obtenerConfiguracionActual() {

            const ahora =
                new Date().toISOString();


           const {
    data,
    error
} = await db

    .from("presentaciones")

    .select(
        "id, evento, jornada_id, fondo, inicio, fin"
    )
           
                .lte("inicio", ahora)

                .gte("fin", ahora)

                .order(
                    "inicio",
                    {
                        ascending: false
                    }
                )

                .limit(1)

                .maybeSingle();


            if (error) {

                console.error(
                    "❌ Error obteniendo presentación:",
                    error
                );

                return null;

            }


            return data || null;

        }


        /* =====================================================
           CARGAR FONDO
        ===================================================== */

        async function cargarFondo(fondo) {

            const elemento =
                document.getElementById("fondo");


            if (
                !fondo ||
                fondo === "normal"
            ) {

                elemento.style.backgroundImage =
                    "none";

                return true;

            }


            const url =
                "https://raw.githubusercontent.com/" +
                "jesusvazquezesp-art/Quiniela-Liga-Mx/" +
                "main/presentaciones/fondos/" +
                fondo +
                ".webp";


            return new Promise(
                (resolve) => {

                    const imagen =
                        new Image();


                    let terminado =
                        false;


                    const finalizar =
                        (resultado) => {

                            if (terminado) {
                                return;
                            }

                            terminado = true;

                            resolve(resultado);

                        };


                    imagen.onload = () => {

                        elemento.style.backgroundImage =
                            `url("${url}")`;

                        finalizar(true);

                    };


                    imagen.onerror = () => {

                        console.warn(
                            "⚠️ Fondo no disponible:",
                            fondo
                        );

                        finalizar(false);

                    };


                    imagen.src = url;


                    setTimeout(
                        () => {

                            finalizar(false);

                        },
                        4000
                    );

                }
            );

        }


        /* =====================================================
           FUNCIONES
        ===================================================== */

        function comprobarFunciones() {

            return (
                typeof fetch === "function" &&
                typeof Promise === "function" &&
                typeof URL === "function"
            );

        }


        /* =====================================================
           ALERTAS
        ===================================================== */

        async function comprobarAlertas() {

            return (
                typeof Notification !==
                "undefined"
            );

        }


        /* =====================================================
           SERVIDOR
        ===================================================== */

        async function comprobarServidor() {

            try {

                const {
                    error
                } = await db

                    .from("presentaciones")

                    .select("id")

                    .limit(1);


                if (error) {

                    console.error(
                        "❌ Supabase:",
                        error
                    );

                    return false;

                }


                return true;

            } catch (error) {

                console.error(
                    "❌ Error servidor:",
                    error
                );

                return false;

            }

        }


        /* =====================================================
           CUENTA
        ===================================================== */

        async function comprobarCuenta() {

            try {

                const {
                    error
                } = await db.auth.getSession();


                if (error) {

                    console.error(
                        "❌ Error cuenta:",
                        error
                    );

                    return false;

                }


                return true;

            } catch (error) {

                console.error(
                    "❌ Error comprobando cuenta:",
                    error
                );

                return false;

            }

        }


        /* =====================================================
           COMUNIDAD
        ===================================================== */

        async function comprobarComunidad() {

            try {

                const {
                    error
                } = await db

                    .from("chat_mensajes")

                    .select("id")

                    .limit(1);


                if (error) {

                    console.error(
                        "❌ Comunidad:",
                        error
                    );

                    return false;

                }


                return true;

            } catch (error) {

                console.error(
                    "❌ Error comunidad:",
                    error
                );

                return false;

            }

        }


        /* =====================================================
           EJECUTAR A001
        ===================================================== */

    

           /* =====================================================
   EJECUTAR PRESENTACIÓN
===================================================== */

async function ejecutarPresentacion() {

    const contenedor =
        document.getElementById(
            "presentacion"
        );


    const animacion =
        obtenerAnimacion();


    if (!animacion) {

        throw new Error(
            "El motor no seleccionó una animación"
        );

    }


    const modulo =
        await import(
         `./presentaciones/animaciones/${animacion}.js`
        );


    if (
        typeof modulo.ejecutar !==
        "function"
    ) {

        throw new Error(
            `${animacion}.js no contiene export function ejecutar()`
        );

    }


    const datos =
        obtenerPresentacion();


    contenedor.style.display =
        "block";


    await modulo.ejecutar(
        contenedor,
        datos.contenido
    );
    
        return {
        animacion: animacion,
        jornada_id: datos.jornada_id
    };

}

        /* =====================================================
           SIN CONEXIÓN
        ===================================================== */

        function mostrarSinConexion() {

            const estado =
                document.getElementById(
                    "estado"
                );


            estado.innerHTML = `

                🔴 Sin conexión a Internet

                <br><br>

                <span style="
                    font-size:18px;
                ">
                    Activa tus datos móviles
                    o conéctate a una red Wi-Fi.
                </span>

                <br><br>

                <button
                    id="boton-reintentar"
                    onclick="iniciarSistema()"
                >
                    🔄 Reintentar
                </button>

            `;

        }


        /* =====================================================
           ARRANQUE
        ===================================================== */

        async function iniciarSistema() {


            /* -------------------------------------------------
               INTERNET
            ------------------------------------------------- */

            estadoCARGANDO(
                s1,
                "🌐 Conexión"
            );


            const internet =
                await comprobarInternet();


            if (!internet) {

                estadoERROR(
                    s1,
                    "🌐 Sin conexión"
                );

                mostrarSinConexion();

                return;

            }


            estadoOK(
                s1,
                "🌐 Conexión"
            );


            /* -------------------------------------------------
               CONFIGURACIÓN
            ------------------------------------------------- */

           const configuracion =
    await obtenerConfiguracionActual();


if (!configuracion) {

    return;

}


await cargarPresentacion(
    configuracion,
    db
);

            /* -------------------------------------------------
               FONDO
            ------------------------------------------------- */

            await cargarFondo(
                configuracion.fondo
            );


            /* -------------------------------------------------
               FUNCIONES
            ------------------------------------------------- */

            estadoCARGANDO(
                s2,
                "📱 Funciones"
            );


            if (
                comprobarFunciones()
            ) {

                estadoOK(
                    s2,
                    "📱 Funciones"
                );

            } else {

                estadoERROR(
                    s2,
                    "📱 Funciones"
                );

            }


            /* -------------------------------------------------
               ALERTAS
            ------------------------------------------------- */

            estadoCARGANDO(
                s3,
                "🔔 Alertas"
            );


            if (
                await comprobarAlertas()
            ) {

                estadoOK(
                    s3,
                    "🔔 Alertas"
                );

            } else {

                estadoERROR(
                    s3,
                    "🔔 Alertas"
                );

            }


            /* -------------------------------------------------
               SERVIDOR
            ------------------------------------------------- */

            estadoCARGANDO(
                s4,
                "☁️ Servidor"
            );


            if (
                await comprobarServidor()
            ) {

                estadoOK(
                    s4,
                    "☁️ Servidor"
                );

            } else {

                estadoERROR(
                    s4,
                    "☁️ Servidor"
                );

                return;

            }


            /* -------------------------------------------------
               CUENTA
            ------------------------------------------------- */

            estadoCARGANDO(
                s5,
                "👤 Cuenta"
            );


            if (
                await comprobarCuenta()
            ) {

                estadoOK(
                    s5,
                    "👤 Cuenta"
                );

            } else {

                estadoERROR(
                    s5,
                    "👤 Cuenta"
                );

            }


            /* -------------------------------------------------
               COMUNIDAD
            ------------------------------------------------- */

            estadoCARGANDO(
                s6,
                "💬 Comunidad"
            );


            if (
                await comprobarComunidad()
            ) {

                estadoOK(
                    s6,
                    "💬 Comunidad"
                );

            } else {

                estadoERROR(
                    s6,
                    "💬 Comunidad"
                );

            }


            /* -------------------------------------------------
               LIMPIAR PANTALLA
            ------------------------------------------------- */

            document
                .getElementById("app")
                .style.display = "none";


          /* -------------------------------------------------
   PRESENTACIÓN
------------------------------------------------- */

try {

    const resultado =
        await ejecutarPresentacion();


    /*
    --------------------------------------------------------
    REGISTRAR EJECUCIÓN EXITOSA
    --------------------------------------------------------
    */

    if (resultado) {

        const {
            animacion,
            jornada_id
        } = resultado;


        const {
            data: asignacion,
            error: errorAsignacion
        } = await db

            .from("animaciones_asignadas")

            .select(
                "id, jornada_id, codigo_animacion, ciclo, torneo"
            )

            .eq(
                "jornada_id",
                jornada_id
            )

            .eq(
                "codigo_animacion",
                animacion
            )

            .order(
                "id",
                {
                    ascending: false
                }
            )

            .limit(1)

            .maybeSingle();


        if (errorAsignacion) {

            console.error(
                "❌ Error buscando asignación:",
                errorAsignacion
            );

        }


        if (asignacion) {

            const {
                error: errorIntento
            } = await db.rpc(
                "registrar_intento_animacion",
                {

                    p_asignacion_id:
                        asignacion.id,

                    p_jornada_id:
                        jornada_id,

                    p_codigo_animacion:
                        animacion,

                    p_ciclo:
                        asignacion.ciclo,

                    p_torneo:
                        asignacion.torneo,

                    p_resultado:
                        "exitosa",

                    p_mensaje_error:
                        null

                }
            );


            if (errorIntento) {

                console.error(
                    "❌ Error registrando ejecución:",
                    errorIntento
                );

            } else {

                console.log(
                    "✅ Animación registrada como exitosa:",
                    animacion
                );

            }

        }

    }


} catch (error) {

    console.log(
        "PRESENTACION:",
        error
    );


    /*
    --------------------------------------------------------
    REPORTAR FALLA DE PRESENTACIÓN
    --------------------------------------------------------
    */

    try {

        const presentacion =
            obtenerPresentacion();


        if (
            presentacion &&
            presentacion.jornada_id
        ) {


            const {
                data: asignacion,
                error: errorAsignacion
            } = await db

                .from("animaciones_asignadas")

                .select(
                    "id, jornada_id, codigo_animacion, ciclo, torneo"
                )

                .eq(
                    "jornada_id",
                    presentacion.jornada_id
                )

                .order(
                    "id",
                    {
                        ascending: false
                    }
                )

                .limit(1)

                .maybeSingle();


            if (errorAsignacion) {

                console.error(
                    "❌ Error buscando asignación fallida:",
                    errorAsignacion
                );

            } else if (asignacion) {


                const {
                    data: reemplazo,
                    error: errorFallo
                } = await db.rpc(
                    "reportar_fallo_animacion",
                    {

                        p_asignacion_id:
                            asignacion.id,

                        p_mensaje_error:
                            error?.message ||
                            String(error)

                    }
                );


                if (errorFallo) {

                    console.error(
                        "❌ Error reportando fallo:",
                        errorFallo
                    );

                } else {

    console.warn(
        "⚠️ Animación fallida:",
        asignacion.codigo_animacion
    );


    const codigoRespaldo =
        reemplazo?.codigo_respaldo;


    if (!codigoRespaldo) {

        console.warn(
            "⚠️ No hay animación de respaldo disponible"
        );

    } else {

        console.log(
            "🛡️ Respaldo asignado:",
            codigoRespaldo
        );


        /*
        --------------------------------------------------------
        EJECUTAR ANIMACIÓN DE RESPALDO
        --------------------------------------------------------
        */

        try {

            const moduloRespaldo =
                await import(
                    `./presentaciones/animaciones/${codigoRespaldo}.js`
                );


            if (
                typeof moduloRespaldo.ejecutar !==
                "function"
            ) {

                throw new Error(
                    `${codigoRespaldo}.js no contiene export function ejecutar()`
                );

            }


            const datos =
                obtenerPresentacion();


            await moduloRespaldo.ejecutar(
                document.getElementById(
                    "presentacion"
                ),
                datos.contenido
            );


            console.log(
                "✅ Respaldo ejecutado correctamente:",
                codigoRespaldo
            );


            /*
            ----------------------------------------------------
            REGISTRAR RESPALDO COMO EXITOSO
            ----------------------------------------------------
            */

            const {
                error: errorIntentoRespaldo
            } = await db.rpc(
                "registrar_intento_animacion",
                {

                    p_asignacion_id:
                        asignacion.id,

                    p_jornada_id:
                        asignacion.jornada_id,

                    p_codigo_animacion:
                        codigoRespaldo,

                    p_ciclo:
                        asignacion.ciclo,

                    p_torneo:
                        asignacion.torneo,

                    p_resultado:
                        "exitosa",

                    p_mensaje_error:
                        null

                }
            );


            if (
                errorIntentoRespaldo
            ) {

                console.error(
                    "❌ Error registrando respaldo:",
                    errorIntentoRespaldo
                );

            } else {

                console.log(
                    "✅ Respaldo registrado como exitoso:",
                    codigoRespaldo
                );

            }


        } catch (
    errorRespaldoEjecucion
) {

    console.error(
        "❌ El respaldo también falló:",
        errorRespaldoEjecucion
    );


    /*
    --------------------------------------------------------
    REGISTRAR RESPALDO COMO FALLIDO
    --------------------------------------------------------
    */

    const {
        error: errorRegistroRespaldo
    } = await db.rpc(
        "registrar_intento_animacion",
        {

            p_asignacion_id:
                asignacion.id,

            p_jornada_id:
                asignacion.jornada_id,

            p_codigo_animacion:
                codigoRespaldo,

            p_ciclo:
                asignacion.ciclo,

            p_torneo:
                asignacion.torneo,

            p_resultado:
                "fallida",

            p_mensaje_error:
                errorRespaldoEjecucion?.message ||
                String(errorRespaldoEjecucion)

        }
    );


    if (errorRegistroRespaldo) {

        console.error(
            "❌ Error registrando fallo del respaldo:",
            errorRegistroRespaldo
        );

    } else {

        console.log(
            "📝 Respaldo registrado como fallido:",
            codigoRespaldo
        );

    }


    /*
    --------------------------------------------------------
    IMPORTANTE:
    NO BUSCAR OTRO RESPALDO
    LA QUINIELA CONTINÚA
    --------------------------------------------------------
    */

}

    }

}

            }

        }

    } catch (errorRespaldo) {

        console.error(
            "❌ Error procesando respaldo:",
            errorRespaldo
        );

    }

}
            
        

            /* -------------------------------------------------
               QUINIELA
            ------------------------------------------------- */

         //   window.location.href =
         //      "quiniela.html";

        }


        /* =====================================================
           INICIO
        ===================================================== */

        iniciarSistema();


        /* =====================================================
           CAMBIOS DE CONEXIÓN
        ===================================================== */

        window.addEventListener(
            "offline",
            () => {

                mostrarSinConexion();

            }
        );


        window.addEventListener(
            "online",
            () => {

                iniciarSistema();

            }
        );


    </script>


</body>

</html>
