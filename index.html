<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Quiniela MX</title>

<style>

body{
    margin:0;
    background:#111827;
    color:white;
    font-family:Arial,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.contenedor{
    text-align:center;
}

h1{
    margin:0;
    font-size:32px;
}

p{
    margin-top:20px;
    color:#d1d5db;
}

</style>

</head>

<body>

<div class="contenedor">

<h1>⚽ Quiniela MX</h1>

<div id="estado" style="margin-top:20px;text-align:left;line-height:28px;">

<div id="s1">🟡 Internet</div>
<div id="s2">⚪ Service Worker</div>
<div id="s3">⚪ Firebase</div>
<div id="s4">⚪ Supabase</div>
<div id="s5">⚪ Sesión</div>
<div id="s6">⚪ Chat</div>

</div>

</div>

<script>

if(!navigator.onLine){

   document.getElementById("estado").innerHTML =
"🔴 Sin conexión a Internet.<br><br>Activa tus datos móviles o WiFi.";

}else{

    console.log("✅ Internet OK");
    
    const s1=document.getElementById("s1");
const s2=document.getElementById("s2");
const s3=document.getElementById("s3");
const s4=document.getElementById("s4");
const s5=document.getElementById("s5");
const s6=document.getElementById("s6");

s1.innerHTML="🟢 Internet";
        
   setTimeout(()=>{

    s2.innerHTML="🟢 Service Worker";

},1000);

    
    setTimeout(()=>{

    s3.innerHTML="🟢 Firebase";

},2000);
    
    
    setTimeout(()=>{

    s4.innerHTML="🟢 Supabase";

},3000);
    
    setTimeout(()=>{

    s5.innerHTML="🟢 Sesión";

},4000);

setTimeout(()=>{

    s6.innerHTML="🟢 Chat";

},5000);
    
    
    
    // Aquí irán las siguientes verificaciones

    setTimeout(()=>{

        location.replace("quiniela.html");

    },6000);

}

</script>

</body>
</html>
